version: 2

models:
  - name: linkedin_pages__posts
    description: Each record represents the performance of a LinkedIn post, combining both UGC posts and shares.
    columns:
      - name: post_id
        description: The unique ID of the post (string representation).
      - name: post_type
        description: The type of the post, either 'ugc' for UGC posts or 'share' for shares.
      - name: post_author
        description: URN of the author of the post.
      - name: post_url
        description: The URL of the post.
      - name: created_timestamp
        description: Timestamp when the post was created.
      - name: first_published_timestamp
        description: The timestamp when the post was first published.
      - name: lifecycle_state
        description: The current state of the post.
      - name: commentary
        description: The text content of the post.
      - name: organization_id
        description: The ID of the organization that owns the post.
      - name: post_title
        description: The title of the post, coalesced from article or media titles.
      - name: content_type
        description: The type of content in the post (e.g., ARTICLE, IMAGE, POLL, TEXT).
      - name: organization_name
        description: The localized name of the organization.
      - name: click_count
        description: The total number of times the post was clicked.
      - name: comment_count
        description: The total number of comments on the post.
      - name: impression_count
        description: The total number of impressions on the post.
      - name: like_count
        description: The total number of likes on the post.
      - name: share_count
        description: The total number of shares on the post.
      - name: source_relation
        description: The source of the record, if the unioning functionality is being used.